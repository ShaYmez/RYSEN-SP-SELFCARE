name: Sync from RYSEN

on:
  workflow_dispatch:
    inputs:
      rysen_ref:
        description: RYSEN git ref (branch, tag, or SHA)
        required: false
        default: master
  repository_dispatch:
    types: [rysen-selfcare-updated]

# contents: push sync commit
# actions: workflow_dispatch Build after sync (GITHUB_TOKEN pushes do not trigger on.push)
permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SP-SELFCARE
        uses: actions/checkout@v4

      - name: Resolve RYSEN ref
        id: ref
        run: |
          REF="${{ github.event.client_payload.ref }}"
          if [ -z "$REF" ]; then
            REF="${{ github.event.inputs.rysen_ref }}"
          fi
          if [ -z "$REF" ]; then
            REF="${{ vars.RYSEN_SYNC_REF }}"
          fi
          if [ -z "$REF" ]; then
            REF="master"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Syncing from RYSEN ref: $REF"

      - name: Checkout RYSEN source
        uses: actions/checkout@v4
        with:
          repository: ShaYmez/RYSEN
          ref: ${{ steps.ref.outputs.ref }}
          path: rysen-src
          sparse-checkout: |
            hotspot_proxy_v2_sc.py
            proxy_db.py
            hotspot_proxy_v2_sc-SAMPLE.cfg
            tests/test_hotspot_proxy.py
          sparse-checkout-cone-mode: false

      - name: Copy synced files
        run: |
          mkdir -p sync tests
          cp rysen-src/hotspot_proxy_v2_sc.py sync/hotspot_proxy_v2.py
          cp rysen-src/proxy_db.py sync/proxy_db.py
          cp rysen-src/hotspot_proxy_v2_sc-SAMPLE.cfg sync/proxy-SAMPLE.cfg
          sed 's/hotspot_proxy_v2_sc/hotspot_proxy_v2/g' \
            rysen-src/tests/test_hotspot_proxy.py > tests/test_hotspot_proxy.py
          git -C rysen-src rev-parse HEAD > sync/.rysen-sha

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync/hotspot_proxy_v2.py sync/proxy_db.py sync/proxy-SAMPLE.cfg sync/.rysen-sha tests/test_hotspot_proxy.py
          if git diff --staged --quiet; then
            echo "No changes to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA=$(cat sync/.rysen-sha)
          git commit -m "sync: update from RYSEN @ ${SHA:0:7}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN commits do not fire on.push workflows — kick Build explicitly.
      - name: Trigger Docker image build
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'image.yml',
              ref: 'master',
            })
            console.log('Dispatched Build-RYSEN-SP-SELFCARE (image.yml)')
